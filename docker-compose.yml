services:
    ticket-flix-api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: ticket-flix-api-engine
      volumes:
        - .:/var/www/html
      depends_on:
        - ticket-flix-db
    
    ticket-flix-webserver:
      image: nginx:alpine
      container_name: ticket-flix-nginx
      ports:
      - "8080:80"
      volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
      - ticket-flix-api

    ticket-flix-db:
      image: mysql:8.0
      container_name: ticket-flix-db-container
      ports:
        - "3306:3306"
      environment:
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db-data:/var/lib/mysql

volumes:
  db-data: